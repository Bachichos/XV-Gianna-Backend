<main class="login">
  <section class="login__tarjeta">

    <span class="login__monograma" aria-hidden="true">
      @if (marca().logo; as logo) { <img class="login__logo" [src]="logo" alt=""> } @else { XV }
    </span>

    <p class="xv-versalita login__antetitulo">Backoffice</p>
    <h1 class="login__titulo">{{ marca().nombre }}</h1>
    <p class="login__ayuda">Entre con su cuenta de Google para gestionar la lista de invitados.</p>

    <p-button
      label="Entrar con Google"
      icon="pi pi-google"
      styleClass="login__boton"
      size="large"
      [fluid]="true"
      [loading]="cargando()"
      (onClick)="entrar()" />

    @if (error()) {
      <div class="login__error" role="alert">
        <p-message severity="error">{{ error() }}</p-message>
      </div>
    }

    <p class="xv-versalita login__pie">{{ fecha() }}</p>

  </section>
</main>
