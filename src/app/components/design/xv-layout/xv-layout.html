<div class="layout" [class.layout--abierto]="abierto()" [class.layout--compacto]="compacto()">

  <header class="layout__barra">
    <button type="button"
            class="layout__hamburguesa"
            (click)="alternar()"
            [attr.aria-expanded]="abierto()"
            aria-controls="menu-lateral"
            aria-label="Abrir el menú">
      <i class="pi" [class.pi-bars]="!abierto()" [class.pi-times]="abierto()" aria-hidden="true"></i>
    </button>
    <span class="layout__marca">{{ marca().nombre }}</span>
  </header>

  <div class="layout__velo" (click)="cerrar()" aria-hidden="true"></div>

  <xv-menu-lateral id="menu-lateral"
                   class="layout__lateral"
                   [compacto]="compacto()"
                   [alternable]="escritorio()"
                   (alternar_compacto)="alternar_compacto()"
                   (navegar)="cerrar()" />

  <main class="layout__contenido">
    <ng-content></ng-content>
  </main>

</div>
